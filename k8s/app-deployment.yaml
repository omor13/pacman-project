apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacman-app
  labels:
    app: pacman
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pacman
  template:
    metadata:
      labels:
        app: pacman
    spec:
      containers:
      - name: pacman
        image: 416338226474.dkr.ecr.us-west-2.amazonaws.com/myapps/pacman:acb560212e87f66673ad3d7c913bdc3e3ffcd325
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: MONGO_SERVICE_HOST
          value: mongo
        - name: MONGO_DATABASE
          value: pacman
        - name: MY_MONGO_PORT
          value: "27017"
        - name: MONGO_USE_SSL
          value: "false"
        - name: MONGO_VALIDATE_SSL
          value: "false"
        - name: MONGO_URL
          value: mongodb://mongo:27017/pacman

---
apiVersion: v1
kind: Service
metadata:
  name: pacman-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
spec:
  type: LoadBalancer
  selector:
    app: pacman
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
