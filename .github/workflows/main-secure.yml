name: Main Workflow
on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  REGION: us-west-2
  ACCOUNT_ID: 416338226474
  ECR_REPOSITORY: myapps/pacman
  ECR_REGISTRY: $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com

jobs:
  cicd:
    name: Deploy using aws eks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure temporary AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.2.3
      with:
        role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/Github_action_role_02.08
        role-session-name: github-actions-${{ github.run_id }}
        aws-region: ${{ env.REGION }}
    
    - name: Confirm aws credentials
      run: |
        aws sts get-caller-identity
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
                
    - name: Build,tag & push Docker image
      run: |
        docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} ./docker
        docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

    - name: Configure eks access
      run: |
        aws eks update-kubeconfig --region ${{ env.REGION }} --name pacman-cluster

    - name: EKS deployment
      run: |
        kubectl apply -f ./k8s/storage-class.yaml
        kubectl apply -f ./k8s/db-sts.yaml  
        kubectl apply -f ./k8s/app-deployment.yaml
        kubectl set image deployment/pacman-app pacman=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.REGION }}.amazonaws.com/myapps/pacman:${{ github.sha }}
        kubectl rollout status deployment pacman-app
        kubectl rollout status statefulset mongo
        kubectl get services pacman-service
