name: Main Workflow
on:
  push:
    branches:
      - main
jobs:
  cicd:
    name: Deploy using aws eks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.1.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2
    
    - name: Confirm aws credentials
      run: |
        aws sts get-caller-identity
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
                
    - name: Build,tag & push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: myapps/pacman
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./docker
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Configure eks access
      run: |
        aws eks update-kubeconfig --region us-west-2 --name pacman-cluster

    - name: EKS deployment
      run: |
        kubectl apply -f ./k8s/storage-class.yaml
        kubectl apply -f ./k8s/db-sts.yaml  
        kubectl apply -f ./k8s/app-deployment.yaml